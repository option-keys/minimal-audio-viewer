<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080809;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}

#upload{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#080809}
#utitle{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#dropzone{width:280px;height:160px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;transition:border-color .2s}
#dropzone:hover{border-color:rgba(212,240,228,.4)}
#dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#dropzone span{font:10px/1.6 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
#unote{font:9px/1.5 'Courier New',monospace;letter-spacing:.08em;color:rgba(255,255,255,.18);text-align:center;max-width:260px;text-transform:uppercase}

#proc{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#080809}
#proc p{font:10px/1 'Courier New',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}

#lbl{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.28);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#newbtn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.3);font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;display:none}

/* CONTROLS - pinned to bottom, always visible */
#ctrl{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  background:rgba(5,5,6,.9);
  border-top:1px solid rgba(255,255,255,.07);
  padding:14px 24px 18px;
  display:none;
  flex-direction:column;
  gap:10px;
  align-items:center;
}
.row{display:flex;align-items:center;gap:10px;width:100%;max-width:340px}
.rl{font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);width:70px;text-align:right;flex-shrink:0}
.rs{flex:1;height:2px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.18);outline:none;cursor:pointer;touch-action:none;border-radius:1px}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.rs::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.rv{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.28);width:28px;flex-shrink:0}
</style>
</head>
<body>

<div id="upload">
  <div id="utitle">SVG to 3D Chrome</div>
  <div id="dropzone">
    <input type="file" id="filein" accept=".svg,image/svg+xml"/>
    <span>Drop SVG here<br>or tap to browse</span>
  </div>
  <div id="unote">Works best with simple bold logos</div>
</div>

<div id="proc"><p>Building 3D...</p></div>

<div id="lbl"></div>
<button id="newbtn">&#8592; new svg</button>

<div id="ctrl">
  <div class="row">
    <span class="rl">depth</span>
    <input type="range" class="rs" id="sdepth" min="1" max="100" value="40" step="1"/>
    <span class="rv" id="vdepth">40</span>
  </div>
  <div class="row">
    <span class="rl">size</span>
    <input type="range" class="rs" id="ssize" min="20" max="200" value="100" step="1"/>
    <span class="rv" id="vsize">100</span>
  </div>
  <div class="row">
    <span class="rl">brightness</span>
    <input type="range" class="rs" id="sbright" min="0" max="100" value="40" step="1"/>
    <span class="rv" id="vbright">40</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script>
// ── renderer ──────────────────────────────────────────
var R = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.2;
R.setClearColor(0x080809, 1);
document.body.appendChild(R.domElement);

var S = new THREE.Scene();
var C = new THREE.PerspectiveCamera(40, 1, 0.001, 1000);

// ── lights ─────────────────────────────────────────────
var BASE = {kl:1.0, r1:2.5, r2:1.8, r3:1.0, r4:0.3, amb:0.15};
var MAX  = {kl:2.5, r1:5.0, r2:3.5, r3:2.5, r4:0.8, amb:0.40};

var kl = new THREE.DirectionalLight(0xffffff, BASE.kl);
kl.position.set(4,8,5); kl.castShadow = true;
kl.shadow.mapSize.width = kl.shadow.mapSize.height = 2048;
kl.shadow.camera.near=.1; kl.shadow.camera.far=50;
kl.shadow.camera.left = kl.shadow.camera.bottom = -5;
kl.shadow.camera.right = kl.shadow.camera.top = 5;
kl.shadow.radius=8; kl.shadow.bias=-.0005;
S.add(kl);
var r1=new THREE.DirectionalLight(0x88bbff,BASE.r1); r1.position.set(-5,1,-3); S.add(r1);
var r2=new THREE.DirectionalLight(0xffcc66,BASE.r2); r2.position.set(5,-1,-2); S.add(r2);
var r3=new THREE.DirectionalLight(0xffffff,BASE.r3); r3.position.set(0,5,-5);  S.add(r3);
var r4=new THREE.DirectionalLight(0xffffff,BASE.r4); r4.position.set(0,0,6);   S.add(r4);
var amb=new THREE.AmbientLight(0xffffff,BASE.amb); S.add(amb);

function setBright(v) {
  var t = v/100;
  kl.intensity  = BASE.kl  + (MAX.kl -BASE.kl )*t;
  r1.intensity  = BASE.r1  + (MAX.r1 -BASE.r1 )*t;
  r2.intensity  = BASE.r2  + (MAX.r2 -BASE.r2 )*t;
  r3.intensity  = BASE.r3  + (MAX.r3 -BASE.r3 )*t;
  r4.intensity  = BASE.r4  + (MAX.r4 -BASE.r4 )*t;
  amb.intensity = BASE.amb + (MAX.amb-BASE.amb)*t;
}
setBright(40);

// ── shadow floor ──────────────────────────────────────
var floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30,30),
  new THREE.ShadowMaterial({opacity:.08})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
floor.visible = false;
S.add(floor);

// ── resize ────────────────────────────────────────────
function resize() {
  R.setSize(innerWidth, innerHeight);
  C.aspect = innerWidth/innerHeight;
  C.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ── orbit ─────────────────────────────────────────────
var o = {th:0, ph:Math.PI/2.2, r:4, tx:0, ty:0, tz:0,
         drag:false, lx:0, ly:0, ix:0, iy:0};

function look() {
  var s = Math.sin(o.ph), c = Math.cos(o.ph);
  C.position.set(o.tx + o.r*s*Math.sin(o.th),
                 o.ty + o.r*c,
                 o.tz + o.r*s*Math.cos(o.th));
  C.lookAt(o.tx, o.ty, o.tz);
}
look();

var DM=.9, PM=.05, PX=Math.PI-.05, SN=.005;
var spin = false;

function pd(x,y){o.drag=true;o.lx=x;o.ly=y;o.ix=o.iy=0;spin=false;}
function pm(x,y){
  if(!o.drag) return;
  var dx=x-o.lx, dy=y-o.ly;
  o.th -= dx*SN;
  o.ph  = Math.max(PM, Math.min(PX, o.ph - dy*SN));
  o.ix=-dx*SN; o.iy=-dy*SN;
  o.lx=x; o.ly=y;
}
function pu(){o.drag=false;}

R.domElement.addEventListener('mousedown', function(e){pd(e.clientX,e.clientY);});
window.addEventListener('mousemove',       function(e){pm(e.clientX,e.clientY);});
window.addEventListener('mouseup', pu);
R.domElement.addEventListener('touchstart', function(e){if(e.touches.length===1)pd(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',        function(e){if(e.touches.length===1)pm(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend', pu, {passive:true});
R.domElement.addEventListener('wheel', function(e){e.preventDefault();},{passive:false});

// ── render loop ───────────────────────────────────────
(function loop(){
  requestAnimationFrame(loop);
  if(!o.drag) {
    if(spin) { o.th += .005; }
    else { o.th+=o.ix; o.ix*=DM; o.ph=Math.max(PM,Math.min(PX,o.ph+o.iy)); o.iy*=DM; }
  }
  look();
  R.render(S, C);
})();

// ── material ──────────────────────────────────────────
var mat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(.85,.85,.85),
  metalness: 1.0,
  roughness: 0.04
});

// ── mesh builder ──────────────────────────────────────
var group = null;
var shapes = [];   // normalised Shape[] — reused when sliders change

function buildMesh(depthPct, sizePct) {
  if(!shapes.length) return;

  if(group) { S.remove(group); group = null; }

  // All SVGs are normalised to 100×100 before this point.
  // Depth slider 1-100 → 0.5 … 50 units in that 100-unit space.
  var depth = 0.5 + (depthPct/100) * 49.5;
  var bevel = Math.min(depth * 0.04, 1.5);

  var es = {
    depth: depth,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel * 0.7,
    bevelOffset: 0,
    bevelSegments: 4
  };

  group = new THREE.Group();
  var any = false;

  shapes.forEach(function(sh) {
    try {
      var geo  = new THREE.ExtrudeGeometry(sh, es);
      var mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      group.add(mesh);
      any = true;
    } catch(e){}
  });

  if(!any) return;

  // SVG Y is flipped vs Three.js
  group.scale.y = -1;

  // Fit the whole group into a 1×1×1 cube, then scale by sizePct/100
  var box  = new THREE.Box3().setFromObject(group);
  var sz   = box.getSize(new THREE.Vector3());
  var ctr  = box.getCenter(new THREE.Vector3());
  var norm = (sizePct/100) / Math.max(sz.x, sz.y, sz.z);

  group.position.sub(ctr.multiplyScalar(norm));
  group.scale.multiplyScalar(norm);

  // Camera distance from actual post-scale bounds
  var box2 = new THREE.Box3().setFromObject(group);
  var ctr2 = box2.getCenter(new THREE.Vector3());
  var sz2  = box2.getSize(new THREE.Vector3());

  o.r  = Math.max(sz2.x, sz2.y, sz2.z) / (2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2)) * 3.2;
  o.tx = ctr2.x; o.ty = ctr2.y; o.tz = ctr2.z;
  look();

  floor.position.y = box2.min.y - 0.001;
  floor.visible = true;

  S.add(group);
}

// ── SVG loader ────────────────────────────────────────
function loadSVG(svgText, filename) {
  document.getElementById('upload').style.display = 'none';
  document.getElementById('proc').style.display   = 'flex';

  // Slight delay so the UI updates before heavy parsing
  setTimeout(function(){
    try {
      var loader = new THREE.SVGLoader();
      var data   = loader.parse(svgText);

      if(!data.paths || !data.paths.length)
        throw new Error('No paths found in this SVG.');

      // ── NORMALISE to 100×100 ────────────────────────
      // Parse viewBox / width / height from raw text
      var vbW = 100, vbH = 100;
      var vb = svgText.match(/viewBox\s*=\s*["'][^"']*["']/);
      if(vb) {
        var nums = vb[0].replace(/viewBox\s*=\s*["']/,'')
                        .replace(/["']/,'').trim().split(/[\s,]+/).map(Number);
        if(nums.length>=4){ vbW=nums[2]; vbH=nums[3]; }
      } else {
        var wm = svgText.match(/\bwidth\s*=\s*["']([\d.]+)/);
        var hm = svgText.match(/\bheight\s*=\s*["']([\d.]+)/);
        if(wm) vbW = parseFloat(wm[1]);
        if(hm) vbH = parseFloat(hm[1]);
      }

      // Scale so that the SVG fits in a 100×100 box
      var sx = 100 / (vbW||100);
      var sy = 100 / (vbH||100);

      // Extract & scale shapes
      shapes = [];
      data.paths.forEach(function(path) {
        path.toShapes(true).forEach(function(sh) {
          scaleShape(sh, sx, sy);
          shapes.push(sh);
        });
      });

      if(!shapes.length) throw new Error('Could not extract shapes from this SVG.');

      // Build with current slider values
      buildMesh(
        parseInt(document.getElementById('sdepth').value),
        parseInt(document.getElementById('ssize').value)
      );

      if(!group) throw new Error('Extrusion failed — try a simpler SVG.');

      // Set initial camera angle & start spin
      o.ph = Math.PI/2.2; o.th = 0; spin = true; look();

      // UI
      var lbl = document.getElementById('lbl');
      lbl.textContent = filename.replace(/\.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();
      lbl.style.display = 'block';

      document.getElementById('proc').style.display   = 'none';
      document.getElementById('ctrl').style.display   = 'flex';
      document.getElementById('newbtn').style.display = 'block';

    } catch(err) {
      document.getElementById('proc').innerHTML =
        '<div style="color:#f88;font:11px monospace;padding:32px;line-height:2;text-align:center;max-width:300px">'
        + err.message
        + '<br><br><span style="color:rgba(255,255,255,.25);cursor:pointer" onclick="location.reload()">try another file</span></div>';
    }
  }, 60);
}

// Scale every point in a THREE.Shape (and its holes)
function scaleShape(sh, sx, sy) {
  scaleCurves(sh.curves, sx, sy);
  if(sh.currentPoint){ sh.currentPoint.x *= sx; sh.currentPoint.y *= sy; }
  if(sh.holes) sh.holes.forEach(function(h){ scaleCurves(h.curves, sx, sy); });
}
function scaleCurves(curves, sx, sy) {
  if(!curves) return;
  curves.forEach(function(c) {
    ['v','v1','v2'].forEach(function(k){
      if(c[k]){ c[k].x *= sx; c[k].y *= sy; }
    });
    if(c.aX !== undefined){ c.aX *= sx; c.aY *= sy; }
    if(c.aRadiusX !== undefined){ c.aRadiusX *= sx; c.aRadiusY *= sy; }
  });
}

// ── sliders ───────────────────────────────────────────
document.getElementById('sdepth').addEventListener('input', function(){
  document.getElementById('vdepth').textContent = this.value;
  buildMesh(+this.value, +document.getElementById('ssize').value);
});
document.getElementById('ssize').addEventListener('input', function(){
  document.getElementById('vsize').textContent = this.value;
  buildMesh(+document.getElementById('sdepth').value, +this.value);
});
document.getElementById('sbright').addEventListener('input', function(){
  document.getElementById('vbright').textContent = this.value;
  setBright(+this.value);
});

// ── file input ────────────────────────────────────────
function handleFile(file) {
  if(!file || !file.name.match(/\.svg$/i)){ alert('SVG files only'); return; }
  var rd = new FileReader();
  rd.onload = function(e){ loadSVG(e.target.result, file.name); };
  rd.readAsText(file);
}
document.getElementById('filein').addEventListener('change', function(e){
  if(e.target.files[0]) handleFile(e.target.files[0]);
});
var dz = document.getElementById('dropzone');
dz.addEventListener('dragover',  function(e){ e.preventDefault(); });
dz.addEventListener('drop',      function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

// ── reset ─────────────────────────────────────────────
document.getElementById('newbtn').addEventListener('click', function(){
  if(group){ S.remove(group); group=null; }
  shapes=[]; floor.visible=false; spin=false;
  document.getElementById('ctrl').style.display   = 'none';
  document.getElementById('newbtn').style.display = 'none';
  document.getElementById('lbl').style.display    = 'none';
  document.getElementById('upload').style.display = 'flex';
  document.getElementById('filein').value = '';
  document.getElementById('sdepth').value=40; document.getElementById('vdepth').textContent='40';
  document.getElementById('ssize').value=100;  document.getElementById('vsize').textContent='100';
  document.getElementById('sbright').value=40; document.getElementById('vbright').textContent='40';
  setBright(40);
});
</script>
</body>
</html>
