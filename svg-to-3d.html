<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0b;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#upload{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a0a0b}
#utitle{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#dz{width:280px;height:160px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;transition:border-color .2s}
#dz:hover{border-color:rgba(212,240,228,.5)}
#dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#dz p{font:10px/1.6 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
#proc{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#0a0a0b}
#pmsg{font:10px/2 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;padding:24px;max-width:320px;white-space:pre-wrap}
#lbl{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#newbtn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.35);font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;display:none}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(4,4,5,.95);border-top:1px solid rgba(255,255,255,.08);padding:16px 0 26px;display:none;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:300px}
.rl{font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);width:70px;text-align:right;flex-shrink:0}
.rs{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.2);outline:none;cursor:pointer;touch-action:none;border-radius:2px}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.rs::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.rv{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.3);width:28px;flex-shrink:0}
</style>
</head>
<body>
<div id="upload"><div id="utitle">SVG to 3D Chrome</div><div id="dz"><input type="file" id="fi" accept=".svg,image/svg+xml"/><p>Drop SVG here<br>or tap to browse</p></div></div>
<div id="proc"><p id="pmsg">Building 3D...</p></div>
<div id="lbl"></div>
<button id="newbtn">&#8592; new svg</button>
<div id="ctrl">
  <div class="row"><span class="rl">depth</span><input type="range" class="rs" id="sd" min="1" max="100" value="30" step="1"/><span class="rv" id="vd">30</span></div>
  <div class="row"><span class="rl">size</span><input type="range" class="rs" id="ss" min="20" max="200" value="100" step="1"/><span class="rv" id="vs">100</span></div>
  <div class="row"><span class="rl">brightness</span><input type="range" class="rs" id="sb" min="0" max="100" value="50" step="1"/><span class="rv" id="vb">50</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x0a0a0b,1);
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40,1,0.001,1000);

var chromeMat = new THREE.MeshStandardMaterial({
  color: new THREE.Color(1,1,1),
  metalness: 1.0,
  roughness: 0.05,
  envMapIntensity: 1.5
});

var pmremGen = new THREE.PMREMGenerator(renderer);
pmremGen.compileEquirectangularShader();
function applyEnv(tex){
  var rt = pmremGen.fromEquirectangular(tex);
  chromeMat.envMap = rt.texture;
  chromeMat.needsUpdate = true;
  scene.environment = rt.texture;
  tex.dispose();
}
new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
  function(tex){applyEnv(tex);pmremGen.dispose();},
  undefined,
  function(){
    var cv=document.createElement('canvas');cv.width=512;cv.height=256;
    var ctx=cv.getContext('2d');
    var g=ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#d0d8e8');g.addColorStop(0.7,'#808898');g.addColorStop(1,'#202428');
    ctx.fillStyle=g;ctx.fillRect(0,0,512,256);
    ctx.fillStyle='rgba(255,255,255,1)';ctx.fillRect(160,0,192,60);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillRect(0,0,80,256);ctx.fillRect(432,0,80,256);
    var t=new THREE.CanvasTexture(cv);t.mapping=THREE.EquirectangularReflectionMapping;
    applyEnv(t);pmremGen.dispose();
  }
);

function addDirLight(col,intens,x,y,z){var l=new THREE.DirectionalLight(col,intens);l.position.set(x,y,z);scene.add(l);return l;}
addDirLight(0xffffff,0.6,3,5,3);
addDirLight(0xffffff,0.4,-3,2,3);
addDirLight(0xffffff,0.3,0,-3,3);
scene.add(new THREE.AmbientLight(0xffffff,0.05));

function setBright(v){
  var t=v/100;
  renderer.toneMappingExposure=0.3+t*1.8;
  chromeMat.envMapIntensity=0.5+t*2.0;
  chromeMat.needsUpdate=true;
}
setBright(50);

function onResize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
onResize();window.addEventListener('resize',onResize);

var camDist=4, orbitTh=0.4, orbitPh=Math.PI/4;
var isDragging=false,lastX=0,lastY=0,inertX=0,inertY=0,autoSpin=false;
var DAMP=0.9,PH_MIN=0.05,PH_MAX=Math.PI-0.05,SENS=0.005;

function updateCamera(){
  var sinPh=Math.sin(orbitPh), cosPh=Math.cos(orbitPh);
  camera.position.set(camDist*sinPh*Math.sin(orbitTh), camDist*cosPh, camDist*sinPh*Math.cos(orbitTh));
  camera.lookAt(0,0,0);
}
updateCamera();

function onDragStart(x,y){isDragging=true;lastX=x;lastY=y;inertX=inertY=0;autoSpin=false;}
function onDragMove(x,y){
  if(!isDragging)return;
  var dx=x-lastX,dy=y-lastY;
  orbitTh-=dx*SENS;
  orbitPh=Math.max(PH_MIN,Math.min(PH_MAX,orbitPh-dy*SENS));
  inertX=-dx*SENS;inertY=-dy*SENS;lastX=x;lastY=y;
}
function onDragEnd(){isDragging=false;}

renderer.domElement.addEventListener('mousedown',function(e){onDragStart(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){onDragMove(e.clientX,e.clientY);});
window.addEventListener('mouseup',onDragEnd);
renderer.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)onDragStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)onDragMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',onDragEnd,{passive:true});
renderer.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});

(function animLoop(){
  requestAnimationFrame(animLoop);
  if(!isDragging){
    if(autoSpin)orbitTh+=0.005;
    else{orbitTh+=inertX;inertX*=DAMP;orbitPh=Math.max(PH_MIN,Math.min(PH_MAX,orbitPh+inertY));inertY*=DAMP;}
  }
  updateCamera();
  renderer.render(scene,camera);
})();

var meshGroup=null, svgShapes=[], svgVBW=100, svgVBH=100;

function buildMesh(depthPct, sizePct){
  if(!svgShapes.length)return;
  if(meshGroup){scene.remove(meshGroup);meshGroup=null;}

  meshGroup = new THREE.Group();
  var maxVB = Math.max(svgVBW,svgVBH);
  var depth  = maxVB*(0.02+(depthPct/100)*0.78);
  var bevel  = Math.min(depth*0.05,maxVB*0.02);
  var extSettings = {depth:depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel*0.8,bevelOffset:0,bevelSegments:5};

  svgShapes.forEach(function(sh){
    try{
      var geo=new THREE.ExtrudeGeometry(sh,extSettings);
      geo.computeVertexNormals();
      meshGroup.add(new THREE.Mesh(geo,chromeMat));
    }catch(e){}
  });
  if(!meshGroup.children.length)return;

  // Measure raw bounds at neutral scale
  meshGroup.scale.set(1,1,1);
  meshGroup.position.set(0,0,0);
  var rawBox = new THREE.Box3().setFromObject(meshGroup);
  var rawSize = rawBox.getSize(new THREE.Vector3());
  var rawCenter = rawBox.getCenter(new THREE.Vector3());

  // Scale: fit largest dim to 1 unit, multiply by sizePct/100, flip Y for SVG
  var normScale = (sizePct/100) / Math.max(rawSize.x, rawSize.y, rawSize.z);
  meshGroup.scale.set(normScale, -normScale, normScale);

  // Re-center: raw center scaled, Y negated because scale.y is negative
  meshGroup.position.set(
    -rawCenter.x * normScale,
     rawCenter.y * normScale,
    -rawCenter.z * normScale
  );

  // Camera distance from final world-space bounding box
  var finalBox = new THREE.Box3().setFromObject(meshGroup);
  var finalSize = finalBox.getSize(new THREE.Vector3());
  var fovRad = camera.fov * Math.PI / 180;
  camDist = Math.max(finalSize.x, finalSize.y, finalSize.z) / (2*Math.tan(fovRad/2)) * 3.5;
  updateCamera();

  scene.add(meshGroup);
}

function loadSVG(svgText, filename){
  document.getElementById('upload').style.display='none';
  document.getElementById('proc').style.display='flex';
  document.getElementById('pmsg').style.color='rgba(255,255,255,.4)';
  document.getElementById('pmsg').textContent='Building 3D...';
  setTimeout(function(){
    try{
      var parsed = new THREE.SVGLoader().parse(svgText);
      if(!parsed.paths||!parsed.paths.length)throw new Error('No paths found in SVG.');
      svgVBW=100;svgVBH=100;
      var vbMatch=svgText.match(/viewBoxs*=s*["']s*([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)s*["']/);
      if(vbMatch){svgVBW=parseFloat(vbMatch[3])||100;svgVBH=parseFloat(vbMatch[4])||100;}
      else{var wm=svgText.match(/widths*=s*["']([d.]+)/),hm=svgText.match(/heights*=s*["']([d.]+)/);if(wm)svgVBW=parseFloat(wm[1]);if(hm)svgVBH=parseFloat(hm[1]);}
      svgShapes=[];
      parsed.paths.forEach(function(p){p.toShapes(true).forEach(function(sh){svgShapes.push(sh);});});
      if(!svgShapes.length)throw new Error('Could not read shapes from SVG.');
      buildMesh(+document.getElementById('sd').value,+document.getElementById('ss').value);
      if(!meshGroup||!meshGroup.children.length)throw new Error('Extrusion failed.');
      orbitPh=Math.PI/4;orbitTh=0.4;autoSpin=true;updateCamera();
      var lbl=document.getElementById('lbl');lbl.textContent=filename.replace(/.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();lbl.style.display='block';
      document.getElementById('proc').style.display='none';
      document.getElementById('ctrl').style.display='flex';
      document.getElementById('newbtn').style.display='block';
    }catch(err){
      document.getElementById('pmsg').style.color='#f66';
      document.getElementById('pmsg').textContent=err.message;
    }
  },60);
}

document.getElementById('sd').addEventListener('input',function(){document.getElementById('vd').textContent=this.value;buildMesh(+this.value,+document.getElementById('ss').value);});
document.getElementById('ss').addEventListener('input',function(){document.getElementById('vs').textContent=this.value;buildMesh(+document.getElementById('sd').value,+this.value);});
document.getElementById('sb').addEventListener('input',function(){document.getElementById('vb').textContent=this.value;setBright(+this.value);});

function handleFile(f){if(!f||!f.name.match(/.svg$/i)){alert('SVG only');return;}var rd=new FileReader();rd.onload=function(e){loadSVG(e.target.result,f.name);};rd.readAsText(f);}
document.getElementById('fi').addEventListener('change',function(e){if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('dz').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('dz').addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
document.getElementById('newbtn').addEventListener('click',function(){
  if(meshGroup){scene.remove(meshGroup);meshGroup=null;}svgShapes=[];autoSpin=false;
  document.getElementById('ctrl').style.display='none';document.getElementById('newbtn').style.display='none';document.getElementById('lbl').style.display='none';document.getElementById('upload').style.display='flex';document.getElementById('fi').value='';
  document.getElementById('sd').value=30;document.getElementById('vd').textContent='30';
  document.getElementById('ss').value=100;document.getElementById('vs').textContent='100';
  document.getElementById('sb').value=50;document.getElementById('vb').textContent='50';
  setBright(50);
});
</script>
</body>
</html>
