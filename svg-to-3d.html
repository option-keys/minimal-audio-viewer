<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080809;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#upload{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#080809}
#utitle{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#dz{width:280px;height:160px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;transition:border-color .2s}
#dz:hover{border-color:rgba(212,240,228,.4)}
#dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#dz p{font:10px/1.6 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
#proc{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#080809}
#pmsg{font:10px/2 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;padding:24px;max-width:300px}
#lbl{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.28);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#newbtn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.3);font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;display:none}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(5,5,6,.92);border-top:1px solid rgba(255,255,255,.07);padding:14px 0 22px;display:none;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;align-items:center;gap:10px;width:300px}
.rl{font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);width:70px;text-align:right;flex-shrink:0}
.rs{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:rgba(255,255,255,.18);outline:none;cursor:pointer;touch-action:none;border-radius:1px}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.rs::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.rv{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.28);width:28px;flex-shrink:0}
</style>
</head>
<body>
<div id="upload">
  <div id="utitle">SVG to 3D Chrome</div>
  <div id="dz">
    <input type="file" id="fi" accept=".svg,image/svg+xml"/>
    <p>Drop SVG here<br>or tap to browse</p>
  </div>
</div>
<div id="proc"><p id="pmsg">Building 3D...</p></div>
<div id="lbl"></div>
<button id="newbtn">&#8592; new svg</button>
<div id="ctrl">
  <div class="row">
    <span class="rl">depth</span>
    <input type="range" class="rs" id="sd" min="1" max="100" value="30" step="1"/>
    <span class="rv" id="vd">30</span>
  </div>
  <div class="row">
    <span class="rl">size</span>
    <input type="range" class="rs" id="ss" min="20" max="200" value="100" step="1"/>
    <span class="rv" id="vs">100</span>
  </div>
  <div class="row">
    <span class="rl">brightness</span>
    <input type="range" class="rs" id="sb" min="0" max="100" value="40" step="1"/>
    <span class="rv" id="vb">40</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script>
var R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.2;R.setClearColor(0x080809,1);
document.body.appendChild(R.domElement);
var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.001,1000);
var B={kl:1,r1:2.5,r2:1.8,r3:1,r4:.3,amb:.15},MX={kl:2.5,r1:5,r2:3.5,r3:2.5,r4:.8,amb:.4};
var kl=new THREE.DirectionalLight(0xffffff,B.kl);kl.position.set(4,8,5);kl.castShadow=true;
kl.shadow.mapSize.width=kl.shadow.mapSize.height=2048;kl.shadow.camera.near=.1;kl.shadow.camera.far=50;
kl.shadow.camera.left=kl.shadow.camera.bottom=-5;kl.shadow.camera.right=kl.shadow.camera.top=5;
kl.shadow.radius=8;kl.shadow.bias=-.0005;S.add(kl);
var r1=new THREE.DirectionalLight(0x88bbff,B.r1);r1.position.set(-5,1,-3);S.add(r1);
var r2=new THREE.DirectionalLight(0xffcc66,B.r2);r2.position.set(5,-1,-2);S.add(r2);
var r3=new THREE.DirectionalLight(0xffffff,B.r3);r3.position.set(0,5,-5);S.add(r3);
var r4=new THREE.DirectionalLight(0xffffff,B.r4);r4.position.set(0,0,6);S.add(r4);
var amb=new THREE.AmbientLight(0xffffff,B.amb);S.add(amb);
function setBright(v){var t=v/100;kl.intensity=B.kl+(MX.kl-B.kl)*t;r1.intensity=B.r1+(MX.r1-B.r1)*t;r2.intensity=B.r2+(MX.r2-B.r2)*t;r3.intensity=B.r3+(MX.r3-B.r3)*t;r4.intensity=B.r4+(MX.r4-B.r4)*t;amb.intensity=B.amb+(MX.amb-B.amb)*t;}
setBright(40);
var fl=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.08}));
fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;fl.visible=false;S.add(fl);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
var o={th:0.3,ph:Math.PI/4,r:4,tx:0,ty:0,tz:0,drag:false,lx:0,ly:0,ix:0,iy:0};
var DM=.9,PM=.05,PX=Math.PI-.05,SN=.005,spin=false;
function look(){var s=Math.sin(o.ph),c=Math.cos(o.ph);C.position.set(o.tx+o.r*s*Math.sin(o.th),o.ty+o.r*c,o.tz+o.r*s*Math.cos(o.th));C.lookAt(o.tx,o.ty,o.tz);}
look();
function pd(x,y){o.drag=true;o.lx=x;o.ly=y;o.ix=o.iy=0;spin=false;}
function pm(x,y){if(!o.drag)return;var dx=x-o.lx,dy=y-o.ly;o.th-=dx*SN;o.ph=Math.max(PM,Math.min(PX,o.ph-dy*SN));o.ix=-dx*SN;o.iy=-dy*SN;o.lx=x;o.ly=y;}
function pu(){o.drag=false;}
R.domElement.addEventListener('mousedown',function(e){pd(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){pm(e.clientX,e.clientY);});
window.addEventListener('mouseup',pu);
R.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)pd(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)pm(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',pu,{passive:true});
R.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});
(function loop(){requestAnimationFrame(loop);if(!o.drag){if(spin)o.th+=.005;else{o.th+=o.ix;o.ix*=DM;o.ph=Math.max(PM,Math.min(PX,o.ph+o.iy));o.iy*=DM;}}look();R.render(S,C);})();
var mat=new THREE.MeshStandardMaterial({color:new THREE.Color(.85,.85,.85),metalness:1,roughness:.04});
var grp=null,rawShapes=[],rawVBW=1,rawVBH=1;

function build(depthPct,sizePct){
  if(!rawShapes.length)return;
  if(grp){S.remove(grp);}
  grp=new THREE.Group();

  // Depth as fraction of the larger viewBox dimension
  // depthPct 1-100 -> 2% to 80% of the SVG's own size
  var maxVB=Math.max(rawVBW,rawVBH);
  var depth=maxVB*(0.02+(depthPct/100)*0.78);
  var bv=Math.min(depth*0.04,maxVB*0.015);

  var es={depth:depth,bevelEnabled:true,bevelThickness:bv,bevelSize:bv*0.7,bevelOffset:0,bevelSegments:4};
  var any=false;
  rawShapes.forEach(function(sh){
    try{
      var geo=new THREE.ExtrudeGeometry(sh,es);
      var m=new THREE.Mesh(geo,mat);
      m.castShadow=true;
      grp.add(m);
      any=true;
    }catch(e){}
  });
  if(!any)return;

  // Flip Y (SVG top-down vs Three.js bottom-up)
  grp.scale.y=-1;

  // Fit entire mesh into a unit cube, then apply size
  var box=new THREE.Box3().setFromObject(grp);
  var sz=box.getSize(new THREE.Vector3());
  var ctr=box.getCenter(new THREE.Vector3());
  var maxDim=Math.max(sz.x,sz.y,sz.z);
  // Normalize to 1 unit, then scale by sizePct/100
  var sc=(sizePct/100)/maxDim;
  grp.scale.multiplyScalar(sc);

  // Re-center after scale
  var box2=new THREE.Box3().setFromObject(grp);
  var ctr2=box2.getCenter(new THREE.Vector3());
  var sz2=box2.getSize(new THREE.Vector3());
  grp.position.set(-ctr2.x,-ctr2.y,-ctr2.z);

  // Set camera distance
  o.r=Math.max(sz2.x,sz2.y,sz2.z)/(2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2))*3;
  o.tx=0;o.ty=0;o.tz=0;
  look();
  fl.position.y=box2.min.y-ctr2.y-.001;fl.visible=true;
  S.add(grp);
}

function loadSVG(txt,name){
  document.getElementById('upload').style.display='none';
  document.getElementById('proc').style.display='flex';
  document.getElementById('pmsg').textContent='Building 3D...';
  document.getElementById('pmsg').style.color='rgba(255,255,255,.4)';

  setTimeout(function(){
    try{
      var loader=new THREE.SVGLoader();
      var data=loader.parse(txt);
      if(!data.paths||!data.paths.length)throw new Error('No paths found in SVG.');

      // Get viewBox — use as-is, NO scaling of curves
      rawVBW=100;rawVBH=100;
      var vb=txt.match(/viewBoxs*=s*["']s*([d.-]+)s+([d.-]+)s+([d.-]+)s+([d.-]+)s*["']/);
      if(vb){rawVBW=parseFloat(vb[3])||100;rawVBH=parseFloat(vb[4])||100;}
      else{
        var wm=txt.match(/(?:^|[s;]|<svg[^>]+)widths*=s*["']([d.]+)/);
        var hm=txt.match(/(?:^|[s;]|<svg[^>]+)heights*=s*["']([d.]+)/);
        if(wm)rawVBW=parseFloat(wm[1]);
        if(hm)rawVBH=parseFloat(hm[1]);
      }

      // Extract shapes WITHOUT modifying the curve data
      rawShapes=[];
      data.paths.forEach(function(path){
        path.toShapes(true).forEach(function(sh){rawShapes.push(sh);});
      });
      if(!rawShapes.length)throw new Error('Could not read shapes from SVG.');

      build(parseInt(document.getElementById('sd').value),parseInt(document.getElementById('ss').value));
      if(!grp)throw new Error('Extrusion failed — try a simpler SVG.');

      // Start with a 3/4 angle view so depth is visible
      o.ph=Math.PI/4; o.th=0.3; spin=true; look();

      var lbl=document.getElementById('lbl');
      lbl.textContent=name.replace(/.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();
      lbl.style.display='block';
      document.getElementById('proc').style.display='none';
      document.getElementById('ctrl').style.display='flex';
      document.getElementById('newbtn').style.display='block';
    }catch(e){
      document.getElementById('pmsg').style.color='#f88';
      document.getElementById('pmsg').textContent=e.message;
    }
  },60);
}

document.getElementById('sd').addEventListener('input',function(){document.getElementById('vd').textContent=this.value;build(+this.value,+document.getElementById('ss').value);});
document.getElementById('ss').addEventListener('input',function(){document.getElementById('vs').textContent=this.value;build(+document.getElementById('sd').value,+this.value);});
document.getElementById('sb').addEventListener('input',function(){document.getElementById('vb').textContent=this.value;setBright(+this.value);});

function hf(file){
  if(!file||!file.name.match(/.svg$/i)){alert('SVG only');return;}
  var rd=new FileReader();
  rd.onload=function(e){loadSVG(e.target.result,file.name);};
  rd.readAsText(file);
}
document.getElementById('fi').addEventListener('change',function(e){if(e.target.files[0])hf(e.target.files[0]);});
document.getElementById('dz').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('dz').addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0])hf(e.dataTransfer.files[0]);});

document.getElementById('newbtn').addEventListener('click',function(){
  if(grp){S.remove(grp);grp=null;}rawShapes=[];fl.visible=false;spin=false;
  document.getElementById('ctrl').style.display='none';
  document.getElementById('newbtn').style.display='none';
  document.getElementById('lbl').style.display='none';
  document.getElementById('upload').style.display='flex';
  document.getElementById('fi').value='';
  document.getElementById('sd').value=30;document.getElementById('vd').textContent='30';
  document.getElementById('ss').value=100;document.getElementById('vs').textContent='100';
  document.getElementById('sb').value=40;document.getElementById('vb').textContent='40';
  setBright(40);
});
</script>
</body>
</html>
