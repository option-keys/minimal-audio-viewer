<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0b;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#upload{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a0a0b}
#utitle{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#dz{width:280px;height:160px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;transition:border-color .2s}
#dz:hover{border-color:rgba(212,240,228,.5)}
#dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#dz p{font:10px/1.6 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
#proc{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#0a0a0b}
#pmsg{font:10px/2 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;padding:24px;max-width:320px;white-space:pre-wrap}
#lbl{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#newbtn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.35);font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;display:none}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(4,4,5,.95);border-top:1px solid rgba(255,255,255,.08);padding:16px 0 26px;display:none;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:300px}
.rl{font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);width:70px;text-align:right;flex-shrink:0}
.rs{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.2);outline:none;cursor:pointer;touch-action:none;border-radius:2px}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.rs::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.rv{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.3);width:28px;flex-shrink:0}
</style>
</head>
<body>
<div id="upload"><div id="utitle">SVG to 3D Chrome</div><div id="dz"><input type="file" id="fi" accept=".svg,image/svg+xml"/><p>Drop SVG here<br>or tap to browse</p></div></div>
<div id="proc"><p id="pmsg">Building 3D...</p></div>
<div id="lbl"></div>
<button id="newbtn">&#8592; new svg</button>
<div id="ctrl">
  <div class="row"><span class="rl">depth</span><input type="range" class="rs" id="sd" min="1" max="100" value="30" step="1"/><span class="rv" id="vd">30</span></div>
  <div class="row"><span class="rl">size</span><input type="range" class="rs" id="ss" min="20" max="200" value="100" step="1"/><span class="rv" id="vs">100</span></div>
  <div class="row"><span class="rl">brightness</span><input type="range" class="rs" id="sb" min="0" max="100" value="50" step="1"/><span class="rv" id="vb">50</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
var R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.0;
R.setClearColor(0x0a0a0b,1);
document.body.appendChild(R.domElement);
var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.001,1000);
var mat=new THREE.MeshStandardMaterial({color:new THREE.Color(1,1,1),metalness:1.0,roughness:0.05,envMapIntensity:1.5});
var pmrem=new THREE.PMREMGenerator(R);
pmrem.compileEquirectangularShader();
function applyEnv(tex){var rt=pmrem.fromEquirectangular(tex);mat.envMap=rt.texture;mat.needsUpdate=true;S.environment=rt.texture;tex.dispose();}
// Load studio HDRI from polyhaven
new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
  function(tex){applyEnv(tex);pmrem.dispose();},
  undefined,
  function(){
    // Fallback: bright procedural env
    var cv=document.createElement('canvas');cv.width=512;cv.height=256;
    var ctx=cv.getContext('2d');
    var g=ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#d0d8e8');g.addColorStop(0.7,'#808898');g.addColorStop(1,'#202428');
    ctx.fillStyle=g;ctx.fillRect(0,0,512,256);
    ctx.fillStyle='rgba(255,255,255,1)';ctx.fillRect(160,0,192,60);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillRect(0,0,80,256);ctx.fillRect(432,0,80,256);
    var t=new THREE.CanvasTexture(cv);t.mapping=THREE.EquirectangularReflectionMapping;
    applyEnv(t);pmrem.dispose();
  }
);
// Extra lights for depth
function dl(c,i,x,y,z){var l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);S.add(l);return l;}
var lights=[dl(0xffffff,0.6,3,5,3),dl(0xffffff,0.4,-3,2,3),dl(0xffffff,0.3,0,-3,3)];
S.add(new THREE.AmbientLight(0xffffff,0.05));
function setBright(v){var t=v/100;R.toneMappingExposure=0.3+t*1.8;mat.envMapIntensity=0.5+t*2.0;mat.needsUpdate=true;}
setBright(50);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
var camDist=4,th=0.4,ph=Math.PI/4,drag=false,lx=0,ly=0,ix=0,iy=0,spin=false;
var DM=.9,PM=.05,PX=Math.PI-.05,SN=.005;
function look(){var s=Math.sin(ph),c=Math.cos(ph);C.position.set(camDist*s*Math.sin(th),camDist*c,camDist*s*Math.cos(th));C.lookAt(0,0,0);}
look();
function pd(x,y){drag=true;lx=x;ly=y;ix=iy=0;spin=false;}
function pm(x,y){if(!drag)return;var dx=x-lx,dy=y-ly;th-=dx*SN;ph=Math.max(PM,Math.min(PX,ph-dy*SN));ix=-dx*SN;iy=-dy*SN;lx=x;ly=y;}
function pu(){drag=false;}
R.domElement.addEventListener('mousedown',function(e){pd(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){pm(e.clientX,e.clientY);});
window.addEventListener('mouseup',pu);
R.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)pd(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)pm(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',pu,{passive:true});
R.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});
(function loop(){requestAnimationFrame(loop);if(!drag){if(spin)th+=.005;else{th+=ix;ix*=DM;ph=Math.max(PM,Math.min(PX,ph+iy));iy*=DM;}}look();R.render(S,C);})();
var grp=null,shapes=[],vbW=100,vbH=100;
function build(dp,sp){
  if(!shapes.length)return;
  if(grp){S.remove(grp);grp=null;}
  grp=new THREE.Group();
  var maxVB=Math.max(vbW,vbH),depth=maxVB*(0.02+(dp/100)*0.78),bv=Math.min(depth*0.05,maxVB*0.02);
  var es={depth:depth,bevelEnabled:true,bevelThickness:bv,bevelSize:bv*0.8,bevelOffset:0,bevelSegments:5};
  shapes.forEach(function(sh){try{var geo=new THREE.ExtrudeGeometry(sh,es);geo.computeVertexNormals();grp.add(new THREE.Mesh(geo,mat));}catch(e){}});
  if(!grp.children.length)return;
  grp.scale.set(1,1,1);grp.position.set(0,0,0);
  var b0=new THREE.Box3().setFromObject(grp),s0=b0.getSize(new THREE.Vector3()),c0=b0.getCenter(new THREE.Vector3());
  var sc=(sp/100)/Math.max(s0.x,s0.y,s0.z);
  grp.scale.set(sc,-sc,sc);
  grp.position.set(-c0.x*sc,c0.y*sc,-c0.z*sc);
  var b1=new THREE.Box3().setFromObject(grp),s1=b1.getSize(new THREE.Vector3());
  camDist=Math.max(s1.x,s1.y,s1.z)/(2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2))*3.5;
  look();S.add(grp);
}
function loadSVG(txt,name){
  document.getElementById('upload').style.display='none';
  document.getElementById('proc').style.display='flex';
  document.getElementById('pmsg').style.color='rgba(255,255,255,.4)';
  document.getElementById('pmsg').textContent='Building 3D...';
  setTimeout(function(){
    try{
      var data=new THREE.SVGLoader().parse(txt);
      if(!data.paths||!data.paths.length)throw new Error('No paths found in SVG.');
      vbW=100;vbH=100;
      var vb=txt.match(/viewBoxs*=s*["']s*([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)s*["']/);
      if(vb){vbW=parseFloat(vb[3])||100;vbH=parseFloat(vb[4])||100;}
      else{var wm=txt.match(/widths*=s*["']([d.]+)/),hm=txt.match(/heights*=s*["']([d.]+)/);if(wm)vbW=parseFloat(wm[1]);if(hm)vbH=parseFloat(hm[1]);}
      shapes=[];data.paths.forEach(function(p){p.toShapes(true).forEach(function(sh){shapes.push(sh);});});
      if(!shapes.length)throw new Error('Could not read shapes.');
      build(+document.getElementById('sd').value,+document.getElementById('ss').value);
      if(!grp||!grp.children.length)throw new Error('Extrusion failed.');
      ph=Math.PI/4;th=0.4;spin=true;look();
      var lbl=document.getElementById('lbl');lbl.textContent=name.replace(/.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();lbl.style.display='block';
      document.getElementById('proc').style.display='none';document.getElementById('ctrl').style.display='flex';document.getElementById('newbtn').style.display='block';
    }catch(e){document.getElementById('pmsg').style.color='#f66';document.getElementById('pmsg').textContent=e.message;}
  },60);
}
document.getElementById('sd').addEventListener('input',function(){document.getElementById('vd').textContent=this.value;build(+this.value,+document.getElementById('ss').value);});
document.getElementById('ss').addEventListener('input',function(){document.getElementById('vs').textContent=this.value;build(+document.getElementById('sd').value,+this.value);});
document.getElementById('sb').addEventListener('input',function(){document.getElementById('vb').textContent=this.value;setBright(+this.value);});
function hf(f){if(!f||!f.name.match(/.svg$/i)){alert('SVG only');return;}var rd=new FileReader();rd.onload=function(e){loadSVG(e.target.result,f.name);};rd.readAsText(f);}
document.getElementById('fi').addEventListener('change',function(e){if(e.target.files[0])hf(e.target.files[0]);});
document.getElementById('dz').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('dz').addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0])hf(e.dataTransfer.files[0]);});
document.getElementById('newbtn').addEventListener('click',function(){
  if(grp){S.remove(grp);grp=null;}shapes=[];spin=false;
  document.getElementById('ctrl').style.display='none';document.getElementById('newbtn').style.display='none';document.getElementById('lbl').style.display='none';document.getElementById('upload').style.display='flex';document.getElementById('fi').value='';
  document.getElementById('sd').value=30;document.getElementById('vd').textContent='30';document.getElementById('ss').value=100;document.getElementById('vs').textContent='100';document.getElementById('sb').value=50;document.getElementById('vb').textContent='50';setBright(50);
});
</script>
</body>
</html>
