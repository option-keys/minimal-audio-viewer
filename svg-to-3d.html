<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0b;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#upload{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0a0a0b}
#utitle{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.45)}
#dz{width:280px;height:160px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;transition:border-color .2s}
#dz:hover{border-color:rgba(212,240,228,.5)}
#dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#dz p{font:10px/1.6 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center}
#proc{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#0a0a0b}
#pmsg{font:10px/2 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;padding:24px;max-width:320px;white-space:pre-wrap}
#lbl{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#newbtn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.35);font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;cursor:pointer;display:none}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(4,4,5,.95);border-top:1px solid rgba(255,255,255,.08);padding:16px 0 26px;display:none;flex-direction:column;gap:12px;align-items:center}
.row{display:flex;align-items:center;gap:12px;width:300px}
.rl{font:9px/1 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);width:70px;text-align:right;flex-shrink:0}
.rs{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:rgba(255,255,255,.2);outline:none;cursor:pointer;touch-action:none;border-radius:2px}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.rs::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.rv{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.3);width:28px;flex-shrink:0}
</style>
</head>
<body>
<div id="upload"><div id="utitle">SVG to 3D Chrome</div><div id="dz"><input type="file" id="fi" accept=".svg,image/svg+xml"/><p>Drop SVG here<br>or tap to browse</p></div></div>
<div id="proc"><p id="pmsg">Building 3D...</p></div>
<div id="lbl"></div>
<button id="newbtn">&#8592; new svg</button>
<div id="ctrl">
  <div class="row"><span class="rl">depth</span><input type="range" class="rs" id="sd" min="1" max="100" value="30" step="1"/><span class="rv" id="vd">30</span></div>
  <div class="row"><span class="rl">size</span><input type="range" class="rs" id="ss" min="20" max="200" value="100" step="1"/><span class="rv" id="vs">100</span></div>
  <div class="row"><span class="rl">brightness</span><input type="range" class="rs" id="sb" min="0" max="100" value="50" step="1"/><span class="rv" id="vb">50</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
var WR=new THREE.WebGLRenderer({antialias:true});
WR.setPixelRatio(Math.min(devicePixelRatio,2));
WR.outputEncoding=THREE.sRGBEncoding;
WR.toneMapping=THREE.ACESFilmicToneMapping;
WR.toneMappingExposure=1.0;
WR.setClearColor(0x0a0a0b,1);
document.body.appendChild(WR.domElement);
var SC=new THREE.Scene();
var CAM=new THREE.PerspectiveCamera(40,1,0.001,1000);
var CHROME=new THREE.MeshStandardMaterial({color:new THREE.Color(1,1,1),metalness:1.0,roughness:0.05,envMapIntensity:1.5});
var PMG=new THREE.PMREMGenerator(WR);
PMG.compileEquirectangularShader();
function applyEnv(tex){var rt=PMG.fromEquirectangular(tex);CHROME.envMap=rt.texture;CHROME.needsUpdate=true;SC.environment=rt.texture;tex.dispose();}
new THREE.RGBELoader().setDataType(THREE.UnsignedByteType).load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',function(t){applyEnv(t);PMG.dispose();},undefined,function(){var cv=document.createElement('canvas');cv.width=512;cv.height=256;var ctx=cv.getContext('2d'),g=ctx.createLinearGradient(0,0,0,256);g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#d0d8e8');g.addColorStop(0.7,'#808898');g.addColorStop(1,'#202428');ctx.fillStyle=g;ctx.fillRect(0,0,512,256);ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(160,0,192,60);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(0,0,80,256);ctx.fillRect(432,0,80,256);var t=new THREE.CanvasTexture(cv);t.mapping=THREE.EquirectangularReflectionMapping;applyEnv(t);PMG.dispose();});
function addDL(c,i,x,y,z){var l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);SC.add(l);}
addDL(0xffffff,0.6,3,5,3);addDL(0xffffff,0.4,-3,2,3);addDL(0xffffff,0.3,0,-3,3);
SC.add(new THREE.AmbientLight(0xffffff,0.05));
function setBright(v){var t=v/100;WR.toneMappingExposure=0.3+t*1.8;CHROME.envMapIntensity=0.5+t*2.0;CHROME.needsUpdate=true;}
setBright(50);
function onResize(){WR.setSize(innerWidth,innerHeight);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();}
onResize();window.addEventListener('resize',onResize);
var CAMDIST=4,TH=0.4,PH=Math.PI/4,DRAG=false,LX=0,LY=0,IX=0,IY=0,SPIN=false;
var DMP=0.9,PHMIN=0.05,PHMAX=Math.PI-0.05,SENS=0.005;
function updateCam(){var sinPH=Math.sin(PH),cosPH=Math.cos(PH);CAM.position.set(CAMDIST*sinPH*Math.sin(TH),CAMDIST*cosPH,CAMDIST*sinPH*Math.cos(TH));CAM.lookAt(0,0,0);}
updateCam();
function dstart(x,y){DRAG=true;LX=x;LY=y;IX=IY=0;SPIN=false;}
function dmove(x,y){if(!DRAG)return;var dx=x-LX,dy=y-LY;TH-=dx*SENS;PH=Math.max(PHMIN,Math.min(PHMAX,PH-dy*SENS));IX=-dx*SENS;IY=-dy*SENS;LX=x;LY=y;}
function dend(){DRAG=false;}
WR.domElement.addEventListener('mousedown',function(e){dstart(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){dmove(e.clientX,e.clientY);});
window.addEventListener('mouseup',dend);
WR.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)dstart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)dmove(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',dend,{passive:true});
WR.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});
(function loop(){requestAnimationFrame(loop);if(!DRAG){if(SPIN)TH+=0.005;else{TH+=IX;IX*=DMP;PH=Math.max(PHMIN,Math.min(PHMAX,PH+IY));IY*=DMP;}}updateCam();WR.render(SC,CAM);})();
var WRAP=null,GEO=null,SVGSHAPES=[],SVGW=100,SVGH=100,RAW_CX=0,RAW_CY=0,RAW_CZ=0;
function applySize(sp){
  if(!WRAP)return;
  var sc=sp/100;
  WRAP.scale.set(sc,-sc,sc);
  WRAP.position.set(-RAW_CX*sc,RAW_CY*sc,-RAW_CZ*sc);
  var fovRad=CAM.fov*Math.PI/180;
  CAMDIST=sc/(2*Math.tan(fovRad/2))*3.5;
  updateCam();
}
function buildGeo(dp){
  if(WRAP){SC.remove(WRAP);WRAP=null;GEO=null;}
  if(!SVGSHAPES.length)return;
  GEO=new THREE.Group();
  var maxVB=Math.max(SVGW,SVGH),depth=maxVB*(0.02+(dp/100)*0.78),bevel=Math.min(depth*0.05,maxVB*0.02);
  var es={depth:depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel*0.8,bevelOffset:0,bevelSegments:5};
  SVGSHAPES.forEach(function(sh){try{var geo=new THREE.ExtrudeGeometry(sh,es);geo.computeVertexNormals();GEO.add(new THREE.Mesh(geo,CHROME));}catch(e){}});
  if(!GEO.children.length)return;
  GEO.scale.set(1,1,1);GEO.position.set(0,0,0);
  var rawBox=new THREE.Box3().setFromObject(GEO);
  var rawSz=rawBox.getSize(new THREE.Vector3());
  var rawCtr=rawBox.getCenter(new THREE.Vector3());
  var norm=1.0/Math.max(rawSz.x,rawSz.y,rawSz.z);
  GEO.scale.set(norm,norm,norm);
  GEO.position.set(-rawCtr.x*norm,-rawCtr.y*norm,-rawCtr.z*norm);
  RAW_CX=rawCtr.x*norm; RAW_CY=rawCtr.y*norm; RAW_CZ=rawCtr.z*norm;
  WRAP=new THREE.Group();
  WRAP.add(GEO);
  SC.add(WRAP);
  applySize(parseInt(document.getElementById('ss').value));
}
function loadSVG(svgText,fname){
  document.getElementById('upload').style.display='none';
  document.getElementById('proc').style.display='flex';
  document.getElementById('pmsg').style.color='rgba(255,255,255,.4)';
  document.getElementById('pmsg').textContent='Building 3D...';
  setTimeout(function(){
    try{
      var parsed=new THREE.SVGLoader().parse(svgText);
      if(!parsed.paths||!parsed.paths.length)throw new Error('No paths found in SVG.');
      SVGW=100;SVGH=100;
      var vm=svgText.match(/viewBoxs*=s*["']s*([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)[s,]+([d.-]+)s*["']/);
      if(vm){SVGW=parseFloat(vm[3])||100;SVGH=parseFloat(vm[4])||100;}
      else{var wm=svgText.match(/widths*=s*["']([d.]+)/),hm=svgText.match(/heights*=s*["']([d.]+)/);if(wm)SVGW=parseFloat(wm[1]);if(hm)SVGH=parseFloat(hm[1]);}
      SVGSHAPES=[];
      parsed.paths.forEach(function(p){p.toShapes(true).forEach(function(sh){SVGSHAPES.push(sh);});});
      if(!SVGSHAPES.length)throw new Error('Could not read shapes from SVG.');
      buildGeo(parseInt(document.getElementById('sd').value));
      if(!WRAP)throw new Error('Extrusion failed.');
      PH=Math.PI/4;TH=0.4;SPIN=true;updateCam();
      var lbl=document.getElementById('lbl');lbl.textContent=fname.replace(/.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();lbl.style.display='block';
      document.getElementById('proc').style.display='none';
      document.getElementById('ctrl').style.display='flex';
      document.getElementById('newbtn').style.display='block';
    }catch(err){document.getElementById('pmsg').style.color='#f66';document.getElementById('pmsg').textContent=err.message;}
  },60);
}
document.getElementById('sd').addEventListener('input',function(){document.getElementById('vd').textContent=this.value;buildGeo(+this.value);});
document.getElementById('ss').addEventListener('input',function(){document.getElementById('vs').textContent=this.value;applySize(+this.value);});
document.getElementById('sb').addEventListener('input',function(){document.getElementById('vb').textContent=this.value;setBright(+this.value);});
function handleFile(f){if(!f||!f.name.match(/.svg$/i)){alert('SVG only');return;}var rd=new FileReader();rd.onload=function(e){loadSVG(e.target.result,f.name);};rd.readAsText(f);}
document.getElementById('fi').addEventListener('change',function(e){if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('dz').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('dz').addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
document.getElementById('newbtn').addEventListener('click',function(){
  if(WRAP){SC.remove(WRAP);WRAP=null;GEO=null;}SVGSHAPES=[];SPIN=false;
  document.getElementById('ctrl').style.display='none';document.getElementById('newbtn').style.display='none';document.getElementById('lbl').style.display='none';document.getElementById('upload').style.display='flex';document.getElementById('fi').value='';
  document.getElementById('sd').value=30;document.getElementById('vd').textContent='30';
  document.getElementById('ss').value=100;document.getElementById('vs').textContent='100';
  document.getElementById('sb').value=50;document.getElementById('vb').textContent='50';
  setBright(50);
});
</script></body></html>
