<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Minimal Audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080809;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#lbl{position:fixed;top:24px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.35);white-space:nowrap;z-index:10;pointer-events:none}
#hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.16em;color:rgba(255,255,255,.25);transition:opacity 2s;white-space:nowrap;z-index:10;pointer-events:none}
#hint.hide{opacity:0}
#loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#080809;transition:opacity .8s}
#loader.fade{opacity:0;pointer-events:none}
#lw{font:11px/1 'Courier New',monospace;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
#bt{width:min(200px,55vw);height:1px;background:rgba(255,255,255,.08);position:relative}
#bf{position:absolute;left:0;top:0;bottom:0;background:#d4f0e4;width:0%;transition:width .2s}
#bp{font:10px/1 'Courier New',monospace;letter-spacing:.12em;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div id="loader"><div id="lw">Minimal Audio</div><div id="bt"><div id="bf"></div></div><div id="bp">0%</div></div>
<div id="lbl">Minimal Audio</div>
<div id="hint">drag to rotate</div>
<script>window.onerror=function(m,s,l){document.getElementById('loader').innerHTML='<div style="color:#f88;font:11px monospace;padding:24px;line-height:1.8;white-space:pre-wrap">'+m+'\nLine:'+l+'</div>';return true;};</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var LE=document.getElementById('loader'),BF=document.getElementById('bf'),BP=document.getElementById('bp');
function err(m){LE.innerHTML='<div style="color:#f88;font:11px monospace;padding:24px;line-height:1.8;white-space:pre-wrap">'+m+'</div>';}
var R,S,C;
try{R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){err('WebGL: '+e.message);throw e;}
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;
R.setClearColor(0x080809,1);document.body.appendChild(R.domElement);
S=new THREE.Scene();C=new THREE.PerspectiveCamera(40,1,.001,1000);
var kl=new THREE.DirectionalLight(0xffffff,1);kl.position.set(4,8,5);kl.castShadow=true;
kl.shadow.mapSize.width=kl.shadow.mapSize.height=2048;kl.shadow.camera.near=.1;kl.shadow.camera.far=50;
kl.shadow.camera.left=kl.shadow.camera.bottom=-5;kl.shadow.camera.right=kl.shadow.camera.top=5;
kl.shadow.radius=8;kl.shadow.bias=-.0005;S.add(kl);
var r1=new THREE.DirectionalLight(0x88bbff,2.5);r1.position.set(-5,1,-3);S.add(r1);
var r2=new THREE.DirectionalLight(0xffcc66,1.8);r2.position.set(5,-1,-2);S.add(r2);
var r3=new THREE.DirectionalLight(0xffffff,1);r3.position.set(0,5,-5);S.add(r3);
var r4=new THREE.DirectionalLight(0xffffff,.3);r4.position.set(0,0,6);S.add(r4);
S.add(new THREE.AmbientLight(0xffffff,.15));
var sp=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.1}));
sp.rotation.x=-Math.PI/2;sp.receiveShadow=true;sp.visible=false;S.add(sp);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
var o={th:0,ph:Math.PI/2,r:3,tg:new THREE.Vector3(),drag:false,lx:0,ly:0,ix:0,iy:0};
var PM=.1,PX=Math.PI-.1,SN=.005,DM=.9;
function ao(){var s=Math.sin(o.ph),c=Math.cos(o.ph);C.position.set(o.tg.x+o.r*s*Math.sin(o.th),o.tg.y+o.r*c,o.tg.z+o.r*s*Math.cos(o.th));C.lookAt(o.tg);}
var spin=true;
function dn(x,y){o.drag=true;o.lx=x;o.ly=y;o.ix=o.iy=0;spin=false;}
function mv(x,y){if(!o.drag)return;var dx=x-o.lx,dy=y-o.ly;o.th-=dx*SN;o.ph=Math.max(PM,Math.min(PX,o.ph-dy*SN));o.ix=-dx*SN;o.iy=-dy*SN;o.lx=x;o.ly=y;}
function up(){o.drag=false;}
R.domElement.addEventListener('mousedown',function(e){dn(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){mv(e.clientX,e.clientY);});
window.addEventListener('mouseup',up);
R.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)dn(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',up,{passive:true});
R.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});
var mx=null,cl=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);if(mx)mx.update(cl.getDelta());if(!o.drag){if(spin)o.th+=.005;else{o.th+=o.ix;o.ix*=DM;o.ph=Math.max(PM,Math.min(PX,o.ph+o.iy));o.iy*=DM;}}ao();R.render(S,C);})();
new THREE.GLTFLoader().load('./model.glb',
  function(g){
    var m=g.scene,mc=0;
    m.traverse(function(n){if(n.isMesh){mc++;n.castShadow=true;n.receiveShadow=true;n.material=new THREE.MeshStandardMaterial({color:new THREE.Color(.85,.85,.85),metalness:1,roughness:.04});}});
    if(mc===0){err('No meshes found.');return;}
    var b=new THREE.Box3().setFromObject(m),c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3());
    var sc=0.5/Math.max(sz.x,sz.y,sz.z);
    m.position.sub(c.multiplyScalar(sc));m.scale.setScalar(sc);
    var b2=new THREE.Box3().setFromObject(m),c2=b2.getCenter(new THREE.Vector3()),s2=b2.getSize(new THREE.Vector3());
    sp.position.y=b2.min.y-.001;sp.visible=true;
    o.r=Math.max(s2.x,s2.y,s2.z)/(2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2))*3.5;
    o.tg.copy(c2);o.ph=Math.PI/2;ao();S.add(m);
    if(g.animations&&g.animations.length){mx=new THREE.AnimationMixer(m);g.animations.forEach(function(a){mx.clipAction(a).play();});}
    BF.style.width='100%';BP.textContent='100%';
    setTimeout(function(){LE.classList.add('fade');setTimeout(function(){LE.style.display='none';},800);},400);
    setTimeout(function(){document.getElementById('hint').classList.add('hide');},5000);
  },
  function(p){if(p.total>0){var pct=Math.round(p.loaded/p.total*100);BF.style.width=pct+'%';BP.textContent=pct+'%';}},
  function(e){err('GLB error: '+String(e));}
);
</script>
</body>
</html>
