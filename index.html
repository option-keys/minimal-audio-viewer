<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Minimal Audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080809;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#lbl{position:absolute;top:24px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.35);white-space:nowrap}
#hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.16em;color:rgba(255,255,255,.25);transition:opacity 2s;white-space:nowrap}
#hint.hide{opacity:0}
#loader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#080809;transition:opacity .8s}
#loader.fade{opacity:0;pointer-events:none}
#lw{font:11px/1 'Courier New',monospace;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.85)}
#bt{width:min(200px,55vw);height:1px;background:rgba(255,255,255,.08);position:relative}
#bf{position:absolute;left:0;top:0;bottom:0;background:#d4f0e4;width:0%;transition:width .2s}
#bp{font:10px/1 'Courier New',monospace;letter-spacing:.12em;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div id="loader"><div id="lw">Minimal Audio</div><div id="bt"><div id="bf"></div></div><div id="bp">0%</div></div>
<div id="ui"><div id="lbl">Minimal Audio</div><div id="hint">drag to rotate</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';

const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.2;
R.setClearColor(0x080809,1);
document.body.appendChild(R.domElement);

const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(40,1,.001,1000);

const kl=new THREE.DirectionalLight(0xffffff,1.2);
kl.position.set(4,8,5);kl.castShadow=true;
kl.shadow.mapSize.set(2048,2048);
kl.shadow.camera.near=.1;kl.shadow.camera.far=50;
kl.shadow.camera.left=-5;kl.shadow.camera.right=5;
kl.shadow.camera.top=5;kl.shadow.camera.bottom=-5;
kl.shadow.radius=8;kl.shadow.bias=-.0005;
S.add(kl);

const r1=new THREE.DirectionalLight(0x88bbff,2.5);r1.position.set(-5,1,-3);S.add(r1);
const r2=new THREE.DirectionalLight(0xffcc66,1.8);r2.position.set(5,-1,-2);S.add(r2);
const r3=new THREE.DirectionalLight(0xffffff,1.0);r3.position.set(0,5,-5);S.add(r3);
const r4=new THREE.DirectionalLight(0xffffff,.3);r4.position.set(0,0,6);S.add(r4);
S.add(new THREE.AmbientLight(0xffffff,.1));

const sp=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.1}));
sp.rotation.x=-Math.PI/2;sp.receiveShadow=true;sp.visible=false;S.add(sp);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);

const o={th:.4,ph:Math.PI/2.2,r:3,tg:new THREE.Vector3(),drag:false,lx:0,ly:0,ix:0,iy:0};
const PM=.1,PX=Math.PI-.1,SN=.005,DM=.9;
function ao(){const sp2=Math.sin(o.ph),cp=Math.cos(o.ph);C.position.set(o.tg.x+o.r*sp2*Math.sin(o.th),o.tg.y+o.r*cp,o.tg.z+o.r*sp2*Math.cos(o.th));C.lookAt(o.tg);}
let as=true;
function dn(x,y){o.drag=true;o.lx=x;o.ly=y;o.ix=o.iy=0;as=false;}
function mv(x,y){if(!o.drag)return;const dx=x-o.lx,dy=y-o.ly;o.th-=dx*SN;o.ph=Math.max(PM,Math.min(PX,o.ph+dy*SN));o.ix=-dx*SN;o.iy=dy*SN;o.lx=x;o.ly=y;}
function up(){o.drag=false;}
R.domElement.addEventListener('mousedown',e=>dn(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
window.addEventListener('mouseup',up);
R.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1)dn(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',e=>{if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',up,{passive:true});
R.domElement.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
R.domElement.addEventListener('gesturestart',e=>e.preventDefault());

let mx=null;const cl=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=cl.getDelta();if(mx)mx.update(dt);if(!o.drag){if(as){o.th+=.005;}else{o.th+=o.ix;o.ix*=DM;o.ph=Math.max(PM,Math.min(PX,o.ph+o.iy));o.iy*=DM;}}ao();R.render(S,C);}
loop();

const LE=document.getElementById('loader');
const BF=document.getElementById('bf');
const BP=document.getElementById('bp');

new GLTFLoader().load('./model.glb',
  gltf=>{
    const m=gltf.scene;
    m.traverse(n=>{if(!n.isMesh)return;n.castShadow=true;n.receiveShadow=true;if(n.material){n.material.envMapIntensity=1.0;n.material.needsUpdate=true;}});
    const b=new THREE.Box3().setFromObject(m);
    const c=b.getCenter(new THREE.Vector3());
    const sz=b.getSize(new THREE.Vector3());
    const sc=2.4/Math.max(sz.x,sz.y,sz.z);
    m.position.sub(c.multiplyScalar(sc));m.scale.setScalar(sc);
    const b2=new THREE.Box3().setFromObject(m);
    const c2=b2.getCenter(new THREE.Vector3());
    const s2=b2.getSize(new THREE.Vector3());
    sp.position.y=b2.min.y-.001;sp.visible=true;
    o.r=Math.max(s2.x,s2.y,s2.z)/(2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2))*1.6;
    o.tg.copy(c2);o.ph=Math.PI/2.2;ao();
    S.add(m);
    if(gltf.animations&&gltf.animations.length){mx=new THREE.AnimationMixer(m);gltf.animations.forEach(a=>mx.clipAction(a).play());}
    BF.style.width='100%';BP.textContent='100%';
    setTimeout(()=>{LE.classList.add('fade');setTimeout(()=>LE.style.display='none',800);},400);
    setTimeout(()=>document.getElementById('hint').classList.add('hide'),5000);
  },
  p=>{if(p.total>0){const pct=Math.round(p.loaded/p.total*100);BF.style.width=pct+'%';BP.textContent=pct+'%';}},
  err=>{console.error(err);LE.innerHTML='<div style="color:rgba(255,255,255,.4);font:11px monospace;text-align:center;padding:40px">Error loading model.glb<br><br>'+err+'</div>';}
);
</script>
</body>
</html>
