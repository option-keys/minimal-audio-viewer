<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GLB Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --ui-fg: rgba(255,255,255,0.55);
      --ui-border: rgba(255,255,255,0.10);
      --accent: #c8f0e0;
      --font: 'DM Mono', 'Courier New', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #label {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ui-fg);
      background: rgba(13,13,15,0.55);
      border: 1px solid var(--ui-border);
      border-radius: 99px;
      padding: 6px 18px;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      transition: opacity 0.5s;
    }

    #hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ui-fg);
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 1.5s;
    }
    #hint.hide { opacity: 0; }
    #hint svg { width: 14px; height: 14px; opacity: 0.7; }

    /* ── Upload overlay ── */
    #drop-zone {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--bg);
    }

    #drop-zone .logo {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    #drop-zone h1 {
      font-size: clamp(22px, 6vw, 36px);
      font-weight: 400;
      color: #fff;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.2;
    }

    #drop-zone p {
      font-size: 12px;
      color: var(--ui-fg);
      letter-spacing: 0.1em;
      text-align: center;
    }

    #file-btn {
      pointer-events: all;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--ui-border);
      color: #fff;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 14px 36px;
      border-radius: 99px;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      margin-top: 8px;
    }
    #file-btn:hover, #file-btn:active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,240,224,0.06);
    }

    #file-input { display: none; }

    .drop-active #drop-zone {
      outline: 2px dashed var(--accent);
      outline-offset: -16px;
    }

    /* ── Loading bar ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: var(--bg);
    }
    #loader.show { display: flex; }
    #loader-text {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ui-fg);
      text-transform: uppercase;
    }
    #loader-bar-track {
      width: min(280px, 70vw);
      height: 1px;
      background: var(--ui-border);
      position: relative;
      overflow: hidden;
    }
    #loader-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

<!-- Upload screen -->
<div id="drop-zone">
  <div class="logo">GLB Viewer</div>
  <h1>Drop your<br>.glb file here</h1>
  <p>or choose a file from your device</p>
  <button id="file-btn">Choose File</button>
  <input type="file" id="file-input" accept=".glb,.gltf" />
</div>

<!-- Loading screen -->
<div id="loader">
  <div id="loader-text">Loading model…</div>
  <div id="loader-bar-track"><div id="loader-bar-fill"></div></div>
</div>

<!-- 3D Canvas -->
<div id="canvas-container"></div>

<!-- HUD -->
<div id="hud">
  <div id="label">GLB Viewer</div>
  <div id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/>
    </svg>
    drag to rotate
  </div>
</div>

<!-- Three.js via CDN (r128) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── GLTFLoader (r128 compatible, inline) ──────────────────────────────────
// Minimal GLTFLoader that supports binary GLB + draco-less GLTF + animations
// We load the full GLTFLoader from a CDN ES module shim
</script>
<script type="module">
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';

// ─── Scene Setup ────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setClearColor(0x0d0d0f, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ─── Camera ──────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 0, 3);

// ─── Lighting ────────────────────────────────────────────────────────────────
// Ambient
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

// Key light (warm, soft)
const keyLight = new THREE.DirectionalLight(0xfff4e0, 1.4);
keyLight.position.set(3, 6, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far = 50;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.radius = 8;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

// Fill light (cool, subtle)
const fillLight = new THREE.DirectionalLight(0xc0e0ff, 0.5);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

// Rim / back light
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0, -3, -5);
scene.add(rimLight);

// Hemisphere sky
const hemi = new THREE.HemisphereLight(0x8ab4d4, 0x3a3028, 0.6);
scene.add(hemi);

// ─── Shadow catcher plane ─────────────────────────────────────────────────
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.18 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
shadowPlane.visible = false; // shown after model loads
scene.add(shadowPlane);

// ─── Resize ──────────────────────────────────────────────────────────────────
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ─── Orbit state (touch + mouse, NO zoom) ────────────────────────────────────
const orbit = {
  theta: 0,     // horizontal angle
  phi: Math.PI / 2.5, // vertical angle (clamped)
  radius: 3,
  target: new THREE.Vector3(0, 0, 0),
  dragging: false,
  lastX: 0, lastY: 0,
  inertiaX: 0, inertiaY: 0,
};

const PHI_MIN = 0.15;
const PHI_MAX = Math.PI - 0.15;
const DAMPING = 0.88;
const SENSITIVITY = 0.005;

function applyOrbit() {
  const sinPhi = Math.sin(orbit.phi);
  const cosPhi = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cosPhi,
    orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}

// Mouse
renderer.domElement.addEventListener('mousedown', e => {
  orbit.dragging = true;
  orbit.lastX = e.clientX;
  orbit.lastY = e.clientY;
  orbit.inertiaX = orbit.inertiaY = 0;
});
window.addEventListener('mousemove', e => {
  if (!orbit.dragging) return;
  const dx = e.clientX - orbit.lastX;
  const dy = e.clientY - orbit.lastY;
  orbit.theta -= dx * SENSITIVITY;
  orbit.phi = Math.max(PHI_MIN, Math.min(PHI_MAX, orbit.phi + dy * SENSITIVITY));
  orbit.inertiaX = -dx * SENSITIVITY;
  orbit.inertiaY = dy * SENSITIVITY;
  orbit.lastX = e.clientX;
  orbit.lastY = e.clientY;
});
window.addEventListener('mouseup', () => { orbit.dragging = false; });

// Touch (single finger only)
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  orbit.dragging = true;
  orbit.lastX = e.touches[0].clientX;
  orbit.lastY = e.touches[0].clientY;
  orbit.inertiaX = orbit.inertiaY = 0;
  hideHint();
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!orbit.dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - orbit.lastX;
  const dy = e.touches[0].clientY - orbit.lastY;
  orbit.theta -= dx * SENSITIVITY;
  orbit.phi = Math.max(PHI_MIN, Math.min(PHI_MAX, orbit.phi + dy * SENSITIVITY));
  orbit.inertiaX = -dx * SENSITIVITY;
  orbit.inertiaY = dy * SENSITIVITY;
  orbit.lastX = e.touches[0].clientX;
  orbit.lastY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', () => { orbit.dragging = false; }, { passive: true });

// Block default scroll/zoom on canvas
renderer.domElement.addEventListener('wheel', e => e.preventDefault(), { passive: false });
renderer.domElement.addEventListener('gesturestart', e => e.preventDefault());

// ─── Animation mixer ─────────────────────────────────────────────────────────
let mixer = null;
const clock = new THREE.Clock();

// ─── Load GLB ────────────────────────────────────────────────────────────────
const loader = new GLTFLoader();

function loadGLB(source) {
  document.getElementById('loader').classList.add('show');
  document.getElementById('loader-bar-fill').style.width = '0%';

  // Remove previous model if any
  scene.children
    .filter(c => c.userData.isModel)
    .forEach(c => scene.remove(c));
  if (mixer) { mixer.stopAllAction(); mixer = null; }

  loader.load(
    source,
    (gltf) => {
      const model = gltf.scene;
      model.userData.isModel = true;

      // Enable shadows on all meshes
      model.traverse(node => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          if (node.material) {
            node.material.envMapIntensity = 0.8;
          }
        }
      });

      // Center + fit model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.0 / maxDim;

      model.position.sub(center.multiplyScalar(scale));
      model.scale.setScalar(scale);

      // Recompute after scale
      const box2 = new THREE.Box3().setFromObject(model);
      const center2 = box2.getCenter(new THREE.Vector3());
      const size2 = box2.getSize(new THREE.Vector3());

      // Place shadow plane at model bottom
      shadowPlane.position.y = box2.min.y - 0.001;
      shadowPlane.visible = true;

      // Pull camera back just enough to fit
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const fitDist = Math.max(size2.x, size2.y, size2.z) / (2 * Math.tan(fovRad / 2)) * 1.4;
      orbit.radius = fitDist;
      orbit.target.copy(center2);
      orbit.phi = Math.PI / 2.5;
      orbit.theta = 0;
      applyOrbit();

      scene.add(model);

      // Animations
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach(clip => {
          const action = mixer.clipAction(clip);
          action.play();
        });
      }

      document.getElementById('loader').classList.remove('show');

      // Show HUD hint
      const hint = document.getElementById('hint');
      hint.classList.remove('hide');
      setTimeout(() => hint.classList.add('hide'), 4000);
    },
    (progress) => {
      if (progress.total > 0) {
        const pct = Math.round((progress.loaded / progress.total) * 100);
        document.getElementById('loader-bar-fill').style.width = pct + '%';
        document.getElementById('loader-text').textContent = `Loading model… ${pct}%`;
      }
    },
    (error) => {
      console.error('GLTFLoader error:', error);
      document.getElementById('loader').classList.remove('show');
      document.getElementById('loader-text').textContent = 'Error loading model.';
      alert('Failed to load model. Make sure it is a valid .glb or .gltf file.');
    }
  );
}

// ─── Auto-rotate (slow, pauses on interaction) ───────────────────────────────
let autoRotate = true;
renderer.domElement.addEventListener('mousedown', () => { autoRotate = false; });
renderer.domElement.addEventListener('touchstart', () => { autoRotate = false; }, { passive: true });

// ─── Render loop ─────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  if (orbit.dragging) {
    // live update handled in event
  } else {
    // inertia
    if (!autoRotate) {
      orbit.theta += orbit.inertiaX;
      orbit.phi = Math.max(PHI_MIN, Math.min(PHI_MAX, orbit.phi + orbit.inertiaY));
      orbit.inertiaX *= DAMPING;
      orbit.inertiaY *= DAMPING;
    } else {
      orbit.theta += 0.003;
    }
  }
  applyOrbit();
  renderer.render(scene, camera);
}
animate();

// ─── File input / drop zone ───────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileBtn = document.getElementById('file-btn');

function handleFile(file) {
  if (!file) return;
  if (!file.name.match(/\.(glb|gltf)$/i)) {
    alert('Please choose a .glb or .gltf file.');
    return;
  }
  dropZone.style.display = 'none';
  document.getElementById('label').textContent = file.name.replace(/\.[^/.]+$/, '');

  const url = URL.createObjectURL(file);
  loadGLB(url);
}

fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

// Drag-and-drop on desktop
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop-active'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop-active'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drop-active');
  handleFile(e.dataTransfer.files[0]);
});

// ─── Hint helper ─────────────────────────────────────────────────────────────
function hideHint() {
  document.getElementById('hint').classList.add('hide');
}

// If you want to auto-load a local file without the picker (see README),
// uncomment and set the path:
// loadGLB('./model.glb');
</script>
</body>
</html>
