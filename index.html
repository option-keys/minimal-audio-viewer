<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Minimal Audio - CDN Test</title>
<style>body{background:#111;color:#fff;font:13px monospace;padding:20px;line-height:2}.ok{color:#4f4}.err{color:#f44}.info{color:#ff4}</style>
</head><body>
<h2 style="color:#d4f0e4;letter-spacing:.2em">CDN TEST</h2>
<div id="log"></div>
<script>
function log(m,c){document.getElementById('log').innerHTML+='<div class="'+(c||'info')+'">'+m+'</div>';}
log('Testing CDNs...','info');

// Test 1: unpkg
var s1=document.createElement('script');
s1.src='https://unpkg.com/three@0.128.0/build/three.min.js';
s1.onload=function(){log('unpkg.com: WORKS ✓','ok');};
s1.onerror=function(){log('unpkg.com: blocked ✗','err');};
document.head.appendChild(s1);

// Test 2: jsdelivr  
var s2=document.createElement('script');
s2.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
s2.onload=function(){log('jsdelivr.net: WORKS ✓','ok');};
s2.onerror=function(){log('jsdelivr.net: blocked ✗','err');};
document.head.appendChild(s2);

// Test 3: cdnjs cloudflare
var s3=document.createElement('script');
s3.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
s3.onload=function(){log('cdnjs.cloudflare.com: WORKS ✓','ok');};
s3.onerror=function(){log('cdnjs.cloudflare.com: blocked ✗','err');};
document.head.appendChild(s3);

// Test 4: raw githack (serves directly from github)
var s4=document.createElement('script');
s4.src='https://rawcdn.githack.com/mrdoob/three.js/r128/build/three.min.js';
s4.onload=function(){log('rawcdn.githack.com: WORKS ✓','ok');};
s4.onerror=function(){log('rawcdn.githack.com: blocked ✗','err');};
document.head.appendChild(s4);

setTimeout(function(){log('--- done waiting ---','ok');},8000);
</script>
</body></html>
