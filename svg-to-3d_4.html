<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SVG to 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080809;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none}
#upload-screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;background:#080809}
#upload-title{font:11px/1 'Courier New',monospace;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.5)}
#drop-zone{width:min(320px,80vw);height:180px;border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
#drop-zone:hover,#drop-zone.drag-over{border-color:rgba(212,240,228,.5);background:rgba(212,240,228,.03)}
#drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#drop-icon{font-size:28px;opacity:.3;color:#fff}
#drop-text{font:10px/1.6 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center}
#drop-sub{font:9px/1 'Courier New',monospace;letter-spacing:.1em;color:rgba(255,255,255,.15);text-transform:uppercase}
#upload-note{font:9px/1.6 'Courier New',monospace;letter-spacing:.1em;color:rgba(255,255,255,.2);text-align:center;max-width:280px;text-transform:uppercase}
#processing{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#080809}
#proc-text{font:10px/1 'Courier New',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
#lbl{position:fixed;top:24px;left:50%;transform:translateX(-50%);font:10px/1 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.3);white-space:nowrap;z-index:10;pointer-events:none;display:none}
#hint{position:fixed;top:50px;left:50%;transform:translateX(-50%);font:9px/1 'Courier New',monospace;letter-spacing:.16em;color:rgba(255,255,255,.2);transition:opacity 2s;white-space:nowrap;z-index:10;pointer-events:none}
#hint.hide{opacity:0}
#reset-btn{position:fixed;top:20px;right:20px;z-index:10;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.35);font:9px/1 'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;cursor:pointer;display:none}
#reset-btn:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}

/* Controls - always visible at bottom when viewer is showing */
#controls{
  position:fixed;bottom:0;left:0;right:0;
  z-index:10;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:0;
  background:rgba(8,8,9,.85);
  padding:16px 20px 20px;
  border-top:1px solid rgba(255,255,255,.06);
}
.ctrl-row{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;margin:4px 0}
.ctrl-label{font:9px/1 'Courier New',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);width:76px;text-align:right;flex-shrink:0}
.ctrl-slider{
  -webkit-appearance:none;appearance:none;
  flex:1;height:2px;
  background:rgba(255,255,255,.15);
  outline:none;cursor:pointer;touch-action:none;
  border-radius:1px;
}
.ctrl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#d4f0e4;cursor:pointer}
.ctrl-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#d4f0e4;border:none;cursor:pointer}
.ctrl-val{font:9px/1 'Courier New',monospace;color:rgba(255,255,255,.3);width:30px;text-align:left;flex-shrink:0}
</style>
</head>
<body>

<div id="upload-screen">
  <div id="upload-title">SVG to 3D Chrome</div>
  <div id="drop-zone">
    <input type="file" id="file-input" accept=".svg,image/svg+xml"/>
    <div id="drop-icon">+</div>
    <div id="drop-text">Drop SVG here<br>or tap to browse</div>
    <div id="drop-sub">svg files only</div>
  </div>
  <div id="upload-note">Works best with simple bold logos.</div>
</div>

<div id="processing"><div id="proc-text">Building 3D mesh...</div></div>

<div id="lbl"></div>
<div id="hint">drag to rotate</div>
<button id="reset-btn">&#8592; new svg</button>

<div id="controls">
  <div class="ctrl-row">
    <span class="ctrl-label">depth</span>
    <input type="range" class="ctrl-slider" id="s-depth" min="1" max="100" value="35" step="1"/>
    <span class="ctrl-val" id="v-depth">35</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">size</span>
    <input type="range" class="ctrl-slider" id="s-size" min="20" max="200" value="100" step="1"/>
    <span class="ctrl-val" id="v-size">100</span>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">brightness</span>
    <input type="range" class="ctrl-slider" id="s-bright" min="0" max="100" value="40" step="1"/>
    <span class="ctrl-val" id="v-bright">40</span>
  </div>
</div>

<script>
window.onerror=function(m,s,l){
  document.getElementById('processing').style.display='flex';
  document.getElementById('processing').innerHTML='<div style="color:#f88;font:11px monospace;padding:24px;line-height:1.8;text-align:center;max-width:320px">'+m+'<br><br><span style="color:rgba(255,255,255,.3);cursor:pointer" onclick="location.reload()">try another file</span></div>';
  return true;
};
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
<script>
var R,S,C,currentGroup=null,parsedPaths=null;

// Lights
var BASE={kl:1.0,r1:2.5,r2:1.8,r3:1.0,r4:0.3,amb:0.15};
var MAX ={kl:2.5,r1:5.0,r2:3.5,r3:2.5,r4:0.8,amb:0.40};

R=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=1.2;R.setClearColor(0x080809,1);
document.body.appendChild(R.domElement);
S=new THREE.Scene();C=new THREE.PerspectiveCamera(40,1,.001,1000);

var kl=new THREE.DirectionalLight(0xffffff,BASE.kl);kl.position.set(4,8,5);kl.castShadow=true;
kl.shadow.mapSize.width=kl.shadow.mapSize.height=2048;
kl.shadow.camera.near=.1;kl.shadow.camera.far=50;
kl.shadow.camera.left=kl.shadow.camera.bottom=-5;
kl.shadow.camera.right=kl.shadow.camera.top=5;
kl.shadow.radius=8;kl.shadow.bias=-.0005;S.add(kl);
var r1=new THREE.DirectionalLight(0x88bbff,BASE.r1);r1.position.set(-5,1,-3);S.add(r1);
var r2=new THREE.DirectionalLight(0xffcc66,BASE.r2);r2.position.set(5,-1,-2);S.add(r2);
var r3=new THREE.DirectionalLight(0xffffff,BASE.r3);r3.position.set(0,5,-5);S.add(r3);
var r4=new THREE.DirectionalLight(0xffffff,BASE.r4);r4.position.set(0,0,6);S.add(r4);
var amb=new THREE.AmbientLight(0xffffff,BASE.amb);S.add(amb);

function applyBrightness(v){
  var t=v/100;
  kl.intensity=BASE.kl+(MAX.kl-BASE.kl)*t;
  r1.intensity=BASE.r1+(MAX.r1-BASE.r1)*t;
  r2.intensity=BASE.r2+(MAX.r2-BASE.r2)*t;
  r3.intensity=BASE.r3+(MAX.r3-BASE.r3)*t;
  r4.intensity=BASE.r4+(MAX.r4-BASE.r4)*t;
  amb.intensity=BASE.amb+(MAX.amb-BASE.amb)*t;
}
applyBrightness(40);

var sp=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.08}));
sp.rotation.x=-Math.PI/2;sp.receiveShadow=true;sp.visible=false;S.add(sp);

function resize(){
  R.setSize(innerWidth,innerHeight);
  C.aspect=innerWidth/innerHeight;
  C.updateProjectionMatrix();
}
resize();window.addEventListener('resize',resize);

var o={th:0,ph:Math.PI/2.2,r:4,tg:new THREE.Vector3(),drag:false,lx:0,ly:0,ix:0,iy:0};
var PM=.05,PX=Math.PI-.05,SN=.005,DM=.9;
function ao(){
  var s=Math.sin(o.ph),c=Math.cos(o.ph);
  C.position.set(o.tg.x+o.r*s*Math.sin(o.th),o.tg.y+o.r*c,o.tg.z+o.r*s*Math.cos(o.th));
  C.lookAt(o.tg);
}
ao();
var spin=false;
function dn(x,y){o.drag=true;o.lx=x;o.ly=y;o.ix=o.iy=0;spin=false;}
function mv(x,y){
  if(!o.drag)return;
  var dx=x-o.lx,dy=y-o.ly;
  o.th-=dx*SN;
  o.ph=Math.max(PM,Math.min(PX,o.ph-dy*SN));
  o.ix=-dx*SN;o.iy=-dy*SN;
  o.lx=x;o.ly=y;
}
function up(){o.drag=false;}
R.domElement.addEventListener('mousedown',function(e){dn(e.clientX,e.clientY);});
window.addEventListener('mousemove',function(e){mv(e.clientX,e.clientY);});
window.addEventListener('mouseup',up);
R.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)dn(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchmove',function(e){if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
window.addEventListener('touchend',up,{passive:true});
R.domElement.addEventListener('wheel',function(e){e.preventDefault();},{passive:false});

(function loop(){
  requestAnimationFrame(loop);
  if(!o.drag){
    if(spin)o.th+=.005;
    else{o.th+=o.ix;o.ix*=DM;o.ph=Math.max(PM,Math.min(PX,o.ph+o.iy));o.iy*=DM;}
  }
  ao();R.render(S,C);
})();

var chromeMat=new THREE.MeshStandardMaterial({
  color:new THREE.Color(.85,.85,.85),
  metalness:1.0,roughness:0.04
});

// The key insight: we NORMALIZE all SVG paths to a 100x100 space
// before extruding, so depth slider is always in the same units
// regardless of the original SVG's viewBox size
function normalizePaths(paths, svgText) {
  // Parse viewBox to get original dimensions
  var vbW=100, vbH=100;
  var vbMatch = svgText.match(/viewBox\s*=\s*["']\s*([\d.\-]+)\s+([\d.\-]+)\s+([\d.\-]+)\s+([\d.\-]+)\s*["']/);
  if(vbMatch){
    vbW = parseFloat(vbMatch[3]);
    vbH = parseFloat(vbMatch[4]);
  } else {
    var wMatch = svgText.match(/width\s*=\s*["']([\d.]+)/);
    var hMatch = svgText.match(/height\s*=\s*["']([\d.]+)/);
    if(wMatch) vbW = parseFloat(wMatch[1]);
    if(hMatch) vbH = parseFloat(hMatch[1]);
  }
  // Scale factor to normalize to 100x100 space
  var scaleX = 100/vbW;
  var scaleY = 100/vbH;

  // Apply scale to each path's subPaths
  var normalized = [];
  paths.forEach(function(path){
    var shapes = path.toShapes(true);
    shapes.forEach(function(shape){
      // Scale the shape points
      shape.curves.forEach(function(c){
        if(c.v1){c.v1.x*=scaleX;c.v1.y*=scaleY;}
        if(c.v2){c.v2.x*=scaleX;c.v2.y*=scaleY;}
        if(c.v){c.v.x*=scaleX;c.v.y*=scaleY;}
        if(c.aX!==undefined){c.aX*=scaleX;c.aY*=scaleY;}
      });
      if(shape.currentPoint){shape.currentPoint.x*=scaleX;shape.currentPoint.y*=scaleY;}
      // Scale holes
      if(shape.holes){
        shape.holes.forEach(function(h){
          h.curves.forEach(function(c){
            if(c.v1){c.v1.x*=scaleX;c.v1.y*=scaleY;}
            if(c.v2){c.v2.x*=scaleX;c.v2.y*=scaleY;}
            if(c.v){c.v.x*=scaleX;c.v.y*=scaleY;}
          });
        });
      }
      normalized.push(shape);
    });
  });
  return normalized;
}

function buildMesh(depthPct, scalePct){
  if(!parsedPaths) return;
  if(currentGroup){S.remove(currentGroup);currentGroup=null;}

  var group=new THREE.Group();
  var hasGeo=false;

  // Depth is now always relative to the normalized 100x100 space
  // depthPct 1-100 → depth 0.5 to 40 units (in normalized space)
  var depth = 0.5 + (depthPct/100) * 39.5;
  var bevel = Math.min(depth * 0.05, 2.0);

  var extrudeSettings={
    depth:depth,
    bevelEnabled:true,
    bevelThickness:bevel,
    bevelSize:bevel*0.7,
    bevelOffset:0,
    bevelSegments:5
  };

  parsedPaths.forEach(function(shape){
    try{
      var geo=new THREE.ExtrudeGeometry(shape,extrudeSettings);
      var mesh=new THREE.Mesh(geo,chromeMat);
      mesh.castShadow=true;mesh.receiveShadow=true;
      group.add(mesh);hasGeo=true;
    }catch(e){}
  });

  if(!hasGeo){return;}

  // Flip Y (SVG is top-down, Three.js is bottom-up)
  group.scale.y=-1;

  // Fit to unit cube, then apply user size
  var box=new THREE.Box3().setFromObject(group);
  var sz=box.getSize(new THREE.Vector3());
  var ctr=box.getCenter(new THREE.Vector3());
  var maxDim=Math.max(sz.x,sz.y,sz.z);
  var norm=(scalePct/100)/maxDim;
  group.position.sub(ctr.multiplyScalar(norm));
  group.scale.multiplyScalar(norm);

  // Recompute bounds for camera
  var box2=new THREE.Box3().setFromObject(group);
  var ctr2=box2.getCenter(new THREE.Vector3());
  var sz2=box2.getSize(new THREE.Vector3());
  sp.position.y=box2.min.y-.001;sp.visible=true;
  o.r=Math.max(sz2.x,sz2.y,sz2.z)/(2*Math.tan(THREE.MathUtils.degToRad(C.fov)/2))*3.0;
  o.tg.copy(ctr2);ao();

  S.add(group);currentGroup=group;
}

function buildFromSVG(svgText, filename){
  document.getElementById('upload-screen').style.display='none';
  document.getElementById('processing').style.display='flex';

  setTimeout(function(){
    try{
      var loader=new THREE.SVGLoader();
      var data=loader.parse(svgText);

      if(!data.paths||data.paths.length===0){
        throw new Error('No paths found in SVG.\nTry a different file.');
      }

      // Normalize all paths to 100x100 coordinate space
      parsedPaths = normalizePaths(data.paths, svgText);

      if(!parsedPaths||parsedPaths.length===0){
        throw new Error('Could not read shapes from this SVG.');
      }

      // Build with current slider values
      var depthVal=parseInt(document.getElementById('s-depth').value);
      var sizeVal=parseInt(document.getElementById('s-size').value);
      buildMesh(depthVal, sizeVal);

      if(!currentGroup){
        throw new Error('Could not extrude this SVG.\nTry simplifying the file.');
      }

      // Set camera
      o.ph=Math.PI/2.2;o.th=0;spin=true;ao();

      // Show name
      var name=filename.replace(/\.svg$/i,'').replace(/[-_]/g,' ').toUpperCase();
      var lbl=document.getElementById('lbl');
      lbl.textContent=name;lbl.style.display='block';

      document.getElementById('processing').style.display='none';
      document.getElementById('controls').style.display='flex';
      document.getElementById('reset-btn').style.display='block';
      document.getElementById('hint').style.display='block';
      setTimeout(function(){document.getElementById('hint').classList.add('hide');},5000);

    }catch(err){
      document.getElementById('processing').innerHTML=
        '<div style="color:#f88;font:11px monospace;padding:32px;line-height:1.8;text-align:center;max-width:300px;white-space:pre-wrap">'+
        err.message+'<br><br><span style="color:rgba(255,255,255,.25);cursor:pointer;font-size:10px" onclick="location.reload()">try another file</span></div>';
    }
  },50);
}

// Sliders
document.getElementById('s-depth').addEventListener('input',function(){
  document.getElementById('v-depth').textContent=this.value;
  buildMesh(parseInt(this.value),parseInt(document.getElementById('s-size').value));
});
document.getElementById('s-size').addEventListener('input',function(){
  document.getElementById('v-size').textContent=this.value;
  buildMesh(parseInt(document.getElementById('s-depth').value),parseInt(this.value));
});
document.getElementById('s-bright').addEventListener('input',function(){
  document.getElementById('v-bright').textContent=this.value;
  applyBrightness(parseInt(this.value));
});

// File handling
function handleFile(file){
  if(!file||!file.name.match(/\.svg$/i)){alert('Please upload an SVG file.');return;}
  var reader=new FileReader();
  reader.onload=function(e){buildFromSVG(e.target.result,file.name);};
  reader.readAsText(file);
}
document.getElementById('file-input').addEventListener('change',function(e){
  if(e.target.files[0])handleFile(e.target.files[0]);
});
var dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',function(){dz.classList.remove('drag-over');});
dz.addEventListener('drop',function(e){
  e.preventDefault();dz.classList.remove('drag-over');
  if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);
});

document.getElementById('reset-btn').addEventListener('click',function(){
  document.getElementById('controls').style.display='none';
  document.getElementById('reset-btn').style.display='none';
  document.getElementById('lbl').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('hint').classList.remove('hide');
  document.getElementById('upload-screen').style.display='flex';
  if(currentGroup){S.remove(currentGroup);currentGroup=null;}
  parsedPaths=null;sp.visible=false;
  document.getElementById('file-input').value='';
  spin=false;
  document.getElementById('s-depth').value=35;document.getElementById('v-depth').textContent='35';
  document.getElementById('s-size').value=100;document.getElementById('v-size').textContent='100';
  document.getElementById('s-bright').value=40;document.getElementById('v-bright').textContent='40';
  applyBrightness(40);
});
</script>
</body>
</html>
